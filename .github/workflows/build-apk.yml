name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # APK собирается только на крупные обновления («Update …») или вручную.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Update')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: src

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check undefined names (no-undef)
        working-directory: src
        run: |
          npm install --no-audit --no-fund
          npm run lint

      - name: Create blank Expo project (latest SDK)
        run: npx --yes create-expo-app@latest app --template blank --no-install

      - name: Add App.js, name, package, Health Connect
        run: |
          cp src/App.js app/App.js
          cp -r src/lib app/lib
          mkdir -p app/assets
          cp src/assets/*.png app/assets/
          cd app
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            c.expo.name = 'Epimely';
            c.expo.slug = 'bio-age';
            c.expo.icon = './assets/icon.png';
            c.expo.android = {
              ...(c.expo.android || {}),
              package: 'com.bioage.proto',
              adaptiveIcon: {
                foregroundImage: './assets/adaptive-icon.png',
                monochromeImage: './assets/adaptive-icon-mono.png',
                backgroundColor: '#11212D'
              },
              permissions: [
                'android.permission.health.READ_STEPS',
                'android.permission.health.READ_SLEEP',
                'android.permission.health.READ_HEART_RATE',
                'android.permission.health.READ_RESTING_HEART_RATE',
                'android.permission.health.READ_EXERCISE',
                'android.permission.health.READ_VO2_MAX',
                'android.permission.health.READ_LEAN_BODY_MASS',
                'android.permission.health.READ_HEART_RATE_VARIABILITY',
                'android.permission.health.READ_BLOOD_PRESSURE',
                'android.permission.health.READ_OXYGEN_SATURATION',
                'android.permission.health.READ_WEIGHT',
                'android.permission.health.READ_HEIGHT',
                'android.permission.health.READ_BODY_TEMPERATURE',
                'android.permission.health.READ_RESPIRATORY_RATE',
                'android.permission.health.READ_DISTANCE',
                'android.permission.health.READ_ACTIVE_CALORIES_BURNED',
                'android.permission.health.READ_HEALTH_DATA_HISTORY'
              ],
              // Данные не покидают телефон: у приложения нет даже доступа в интернет.
              blockedPermissions: [
                'android.permission.INTERNET',
                'android.permission.SYSTEM_ALERT_WINDOW',
                'android.permission.READ_EXTERNAL_STORAGE',
                'android.permission.WRITE_EXTERNAL_STORAGE'
              ]
            };
            c.expo.plugins = [
              ...(c.expo.plugins || []),
              'react-native-health-connect',
              // Системный экран — только фон: логотип рисует экран загрузки приложения.
              ['expo-splash-screen', { image: './assets/splash-blank.png', backgroundColor: '#11212D', imageWidth: 1 }],
              ['expo-build-properties', { android: { minSdkVersion: 26 } }]
            ];
            fs.writeFileSync('app.json', JSON.stringify(c, null, 2));
          "

      - name: Install dependencies
        working-directory: app
        run: |
          npm install
          npx expo install react-native-health-connect expo-build-properties expo-splash-screen react-native-svg @react-native-async-storage/async-storage react-native-safe-area-context

      - name: Prebuild Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk ../../out/epimely.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epimely-apk
          path: out/epimely.apk
          if-no-files-found: error
